[build]
  command = "npm run build"
  publish = "dist"

# service worker 和 manifest 不能被长期缓存，否则更新发不出去
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
